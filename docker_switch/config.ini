# ===============================================================
# Docker Bridge Watcher - Configuration
# ===============================================================

# 1. Target Project Directory
# The directory containing docker-compose.yaml (or docker-compose.yml / compose.yaml).
# Values:
#   auto           - Uses parent directory (..\) relative to docker_switch
#   C:\path\to\dir - Absolute or relative path to any project directory on host
PROJECT_DIR=auto

# 2. Safe Mode
# When enabled (true), destructive commands (like 'rm', 'prune') are blocked.
# Values:
#   true  - Safe mode enabled (recommended)
#   false - Safe mode disabled (full whitelist permitted)
SAFE_MODE=true
